---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: logging
data:
  vector.yaml: |
    data_dir: /vector-data-dir

    sources:
      app_logs:
        type: kubernetes_logs
        extra_field_selector: metadata.namespace=task-tracker

    transforms:
      parse:
        type: remap
        inputs: ["app_logs"]
        source: |
          parsed, err = parse_json(.message)
          if err == null && is_object(parsed) {
            . = merge!(., parsed)
          }
          del(.file)
          del(.kubernetes.node_labels)
          del(.kubernetes.namespace_labels)
          del(.kubernetes.pod_annotations)
          del(.kubernetes.pod_uid)
          del(.kubernetes.pod_ips)
          del(.kubernetes.container_id)
          del(.kubernetes.container_image_id)
          . = flatten(.)
          if !exists(."@timestamp") {
            ."@timestamp" = .timestamp
          }
          del(.timestamp)
          if !exists(."service.name") {
            ."service.name" = "task-tracker-" + (string(."kubernetes.container_name") ?? "unknown")
          }
          if !exists(."log.level") {
            msg = string(.message) ?? ""
            if match(msg, r'(?i)\b(error|fatal|panic|crit|emerg|alert)\b') {
              ."log.level" = "ERROR"
            } else if match(msg, r'(?i)\bwarn(ing)?\b') {
              ."log.level" = "WARN"
            } else {
              ."log.level" = "INFO"
            }
          }

    sinks:
      victoria_logs:
        type: elasticsearch
        inputs: ["parse"]
        endpoints: ["http://victoria-logs.logging.svc:9428/insert/elasticsearch/"]
        api_version: v8
        mode: bulk
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: "@timestamp"
          _stream_fields: kubernetes.pod_namespace,kubernetes.container_name,kubernetes.pod_name
...
