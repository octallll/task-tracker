---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: task-tracker
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: backend
  type: ClusterIP
...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 40
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      containers:
      - image: task-tracker-backend:1.0.0
        imagePullPolicy: IfNotPresent
        name: backend
        envFrom:
        - configMapRef:
            name: backend
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 512Mi
...
