---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - image: task-tracker-prober:1.0.0
        imagePullPolicy: IfNotPresent
        name: prober
        env:
        - name: PROBER_TARGET
          value: http://frontend
        - name: PROBER_INTERVAL_SECONDS
          value: "15"
        - name: PROBER_TIMEOUT_SECONDS
          value: "2"
        ports:
        - name: metrics
          containerPort: 9100
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
...
