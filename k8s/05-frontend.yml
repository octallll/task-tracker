---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: task-tracker
spec:
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: frontend
  type: NodePort
...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: task-tracker-frontend:1.0.0
        imagePullPolicy: IfNotPresent
        name: frontend
        env:
        - name: NGINX_PORT
          value: "80"
        - name: BACKEND_URL
          value: http://backend:8080
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
...
