server:
  port: ${PORT:8080}

spring:
  application:
    name: task-tracker
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: task-tracker-backend

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: task-tracker-backend
